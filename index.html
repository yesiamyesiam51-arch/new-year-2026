<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Happy New Year 2026 – Apsaria</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Poppins:wght@400;600&family=Caveat&display=swap" rel="stylesheet">
</head>
<body class="page-0">

  <!-- Landing Page -->
  <div class="container" id="landing">
    <h1 id="greeting">🎆 Happy New Year 2026 – Apsaria 🎆</h1>
    <button id="startBtn">Start</button>
  </div>

  <!-- Romantic Wishes Pages -->
  <div class="container hidden" id="romantic">
    <div class="message-box">
      <p id="romanticText"></p>
      <button id="romanticNext">Next</button>
    </div>
  </div>

  <!-- Questions Page -->
  <div class="container hidden" id="questions">
    <div class="question-box">
      <p id="questionText"></p>
      <input type="text" id="answerInput" placeholder="Type here...">
      <button id="nextBtn">Next</button>
    </div>
  </div>

  <!-- Summary Page -->
  <div class="container hidden" id="summary">
    <h2>Your Answers</h2>
    <div id="answersList"></div>
  </div>

  <script src="script.js"></script>
</body>
</html>
